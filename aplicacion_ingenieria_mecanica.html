<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aplicación a la Ingeniería Mecánica</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f6fa; color: #1c2533; }
  header { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
  header h1 { font-size: 20px; margin: 0; color: #1f3b73; }
  header span { font-size: 13px; color: #5b6575; }
  .grid { display: grid; gap: 10px; padding: 0 14px 14px;
          grid-template-columns: repeat(4, 1fr);
          grid-auto-rows: max(170px, calc((100vh - 56px - 14px - 30px) / 4)); }
  .card { background: #fff; border: 1px solid #dfe3ea; border-radius: 10px; padding: 8px 10px 4px;
          display: flex; flex-direction: column; cursor: zoom-in; transition: box-shadow .15s, transform .15s; min-width: 0; }
  .card:hover { box-shadow: 0 6px 18px rgba(31,59,115,.18); transform: translateY(-2px); }
  .card h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card h3::after { content: " ⤢"; color: #8a94a6; }
  .card .plot { flex: 1; min-height: 0; pointer-events: none; }
  .card.kpis { grid-column: span 2; grid-row: span 2; }
  #vista { position: fixed; inset: 0; background: #fff; display: none; flex-direction: column; z-index: 10; }
  #vista.abierta { display: flex; }
  #vista .barra { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid #dfe3ea; }
  #vista .barra h2 { flex: 1; font-size: 17px; margin: 0; }
  #vista button { font-size: 14px; padding: 6px 12px; border: 1px solid #c8cfda; border-radius: 8px; background: #fff; cursor: pointer; }
  #vista button:hover { background: #eef2f8; }
  #grande { flex: 1; min-height: 0; }
  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 220px; }
  }
</style></head>

<header><h1>⚙️ Aplicación a la Ingeniería Mecánica · Fresadora (datos AI4I 2020)</h1><span>Calidad: Todas · toca una gráfica para verla en grande</span></header>
<div class="grid" id="grid"></div>
<div id="vista">

  <div id="grande"></div>
</div>

const titulo = f => (f.layout.title && (f.layout.title.text || f.layout.title)) || "";
const grid = document.getElementById("grid");
const filas = Math.ceil((FIGURAS.length - 1 + 4) / 4);   // 4 columnas; los KPIs ocupan 4 lugares
if (window.innerWidth > 900) grid.style.gridAutoRows = `max(150px, calc((100vh - 100px) / ${filas}))`;
const vista = document.getElementById("vista");
const grande = document.getElementById("grande");
let actual = -1;

FIGURAS.forEach((fig, i) => {
  const card = document.createElement("div");
  card.className = "card" + (i === 0 ? " kpis" : "");
  card.innerHTML = `<h3>${titulo(fig)}</h3><div class="plot"></div>`;
  card.onclick = () => abrir(i);
  grid.appendChild(card);
  const div = card.querySelector(".plot");
  const layout = Object.assign({}, fig.layout, {
    title: null, autosize: true, height: div.clientHeight || 160,
    margin: i === 0 ? {l: 10, r: 10, t: 10, b: 10} : {l: 34, r: 8, t: 6, b: 26},
    showlegend: false, font: {size: 9}
  });
  if (i > 0) layout.annotations = [];
  let data = fig.data;
  if (i === 0) {  // KPIs: números más chicos para que quepan en la miniatura
    data = fig.data.map(t => Object.assign({}, t, {
      number: Object.assign({}, t.number, {font: {size: t.gauge ? 20 : 26}}),
      delta: Object.assign({}, t.delta, {font: {size: 11}}),
      title: Object.assign({}, t.title, {font: {size: 12}})
    }));
  }
  Plotly.newPlot(div, data, layout, {staticPlot: true, responsive: true, displayModeBar: false});
});

function abrir(i) {
  actual = (i + FIGURAS.length) % FIGURAS.length;
  const fig = FIGURAS[actual];
  document.getElementById("titulo").textContent = titulo(fig);
  vista.classList.add("abierta");
  Plotly.purge(grande);
  const layout = Object.assign({}, fig.layout, {title: null, autosize: true, height: null, width: null});
  Plotly.newPlot(grande, fig.data, layout, {responsive: true, displaylogo: false});
}
function cerrar() { vista.classList.remove("abierta"); Plotly.purge(grande); actual = -1; }
document.getElementById("cerrar").onclick = cerrar;
document.getElementById("ant").onclick = () => abrir(actual - 1);
document.getElementById("sig").onclick = () => abrir(actual + 1);
document.addEventListener("keydown", e => {
  if (actual < 0) return;
  if (e.key === "Escape") cerrar();
  if (e.key === "ArrowRight") abrir(actual + 1);
  if (e.key === "ArrowLeft") abrir(actual - 1);
});
</script>
